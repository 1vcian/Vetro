name: ci

on:
  push:
  pull_request:
  # Full run every night (all jobs, kselftest included) and by hand.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # In CI an oracle skip is a failure.
  VETRO_REQUIRE_ORACLE: "1"

jobs:
  # Which jobs are needed (ADR 0025): we look at what changes relative to the
  # previous commit (push) or the base (PR). Everything runs anyway at night, by hand,
  # on a push that creates the branch, or with "[ci full]" in the commit message.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.f.outputs.rust }}
      linux: ${{ steps.f.outputs.linux }}
      boot: ${{ steps.f.outputs.boot }}
      kernel: ${{ steps.f.outputs.kernel }}
      web: ${{ steps.f.outputs.web }}
      site: ${{ steps.f.outputs.site }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: tools/ci-changes.sh >> "$GITHUB_OUTPUT"

  native:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: QEMU oracle
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-user
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  wasm:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --target wasm32-unknown-unknown --workspace --exclude vetro-cli --exclude vetro-diff --exclude vetro-isa-tests --exclude vetro-linux-tests --exclude vetro-jit-native

  # Linux arm64 binaries (BusyBox, C programs) compared with QEMU. Runs on
  # an arm64 runner: the Alpine container that compiles the binaries is native.
  linux:
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    runs-on: ubuntu-24.04-arm
    env:
      VETRO_REQUIRE_GUEST_BINS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: QEMU oracle
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-user
      - uses: Swatinem/rust-cache@v2
      - name: Guest binaries
        run: tools/guest-bins/build.sh
      - name: RISU (QEMU images and traces)
        run: tools/risu/build.sh
      - name: LTP (build)
        run: tools/ltp/build.sh
      - run: cargo test --release -p vetro-linux-tests
        env:
          VETRO_LTP_FULL: "1"
      # M4: the same tests with the JIT (threshold 0: every block is translated at once).
      - name: Linux tests with the JIT
        run: cargo test --release -p vetro-linux-tests
        env:
          VETRO_LTP_FULL: "1"
          VETRO_JIT: "1"
          VETRO_JIT_THRESHOLD: "0"

  # The TypeScript lint (tsc --noEmit) is added when web/ is born (M5).

  # M3: the guest kernel (Linux + initramfs) boots to the shell under
  # qemu-system-aarch64 (reference) and under Vetro, with the same log.
  # The kernel is rebuilt only if the configuration or scripts change.
  # With only web/ changed, only the kernel (from the cache) and the web tests
  # run; kselftest (the longest) only if the guest kernel changes.
  boot:
    needs: changes
    if: needs.changes.outputs.boot == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04-arm
    env:
      VETRO_REQUIRE_GUEST_KERNEL: "1"
      VETRO_REQUIRE_SYSTEM_ORACLE: "1"
      # kselftest in the guest under QEMU and under Vetro (tests/boot/tests/kselftest.rs).
      VETRO_KSELFTEST: ${{ needs.changes.outputs.kernel == 'true' && '1' || '0' }}
      # pcapng and HAR reread by tshark, har-validator and haralyzer in Docker
      # (tests/boot/tests/analysis.rs, tools/analysis/check.sh, ADR 0016).
      VETRO_REQUIRE_ANALYSIS_TOOLS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      # qemu-user: syscall oracle in the introspection test (ADR 0027).
      - name: QEMU oracle (system and user)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-arm qemu-user
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: target/guest-kernel
          key: guest-kernel-${{ hashFiles('guest/kernel/config/**', 'guest/kernel/initramfs/**', 'guest/kernel/kselftest/**', 'tools/guest-kernel/**', 'tools/guest-bins/**') }}
      # Guest binaries (static BusyBox, test programs): built by the kernel
      # build, but the introspection test also reads them when the kernel
      # comes from the cache, so they get their own cache entry.
      - uses: actions/cache@v4
        with:
          path: target/guest-bins
          key: guest-bins-${{ hashFiles('tools/guest-bins/**', 'tests/linux/c/**') }}
      - name: Guest binaries
        run: test -f target/guest-bins/busybox || tools/guest-bins/build.sh
      # kselftest.sh uses the sources extracted by build.sh in the Docker volume:
      # they are built together, and cached together.
      - name: Guest kernel, initramfs and kselftest
        run: |
          set -o pipefail
          test -f target/guest-kernel/initramfs-kselftest.cpio.gz \
            || { tools/guest-kernel/build.sh && tools/guest-kernel/kselftest.sh; } 2>&1 | tee boot-build.log
      # Job logs can only be read when authenticated: on failure the
      # last lines become annotations, visible from the public API.
      - name: Boot under QEMU and under Vetro
        if: needs.changes.outputs.boot == 'true'
        run: |
          set -o pipefail
          cargo test --release -p vetro-boot-tests -- --nocapture --test-threads=1 2>&1 | tee boot-test.log
      # M4 (ADR 0013): the same boot with the system-mode JIT
      # (wasmtime) must give the same instructions and the same log, byte for
      # byte, as the interpreter (the test runs both and compares them).
      - name: Boot under Vetro with the JIT
        if: needs.changes.outputs.boot == 'true'
        run: |
          set -o pipefail
          cargo test --release -p vetro-boot-tests --test vetro -- --nocapture 2>&1 | tee boot-jit.log
          grep -E '^(interprete|JIT \(soglia)' boot-jit.log | sed 's/^/::notice title=JIT nativo::/'
        env:
          VETRO_JIT: "1"
      # M4: the same machine compiled to wasm32, in Node (V8), with
      # the interpreter and with the JIT. Same instructions and same log
      # as the native interpreter; the step fails if the JIT in V8 is slower
      # than the native interpreter measured here (M4 threshold, ADR 0012).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Boot in WebAssembly (Node), with the JIT, and timings
        run: |
          set -o pipefail
          tools/wasm-boot.sh --jit 2>&1 | tee wasm-boot.log
          grep -A4 '^==> tempi' wasm-boot.log | sed 's/^/::notice title=tempi di avvio::/'
      # M5: the web app and the vetro-wasm device API in Node: disk
      # via HTTP Range (same instructions and same log as a local disk),
      # framebuffer and inputs; the app in headless Chrome if the runner has it.
      - name: Web app (Node, headless Chrome if available)
        run: |
          set -o pipefail
          tools/web-test.sh 2>&1 | tee web-test.log
      - if: failure()
        run: |
          for f in boot-build.log boot-test.log boot-jit.log wasm-boot.log web-test.log; do
            [ -s "$f" ] || continue
            echo "::error title=$f::$(grep -vE '^\s*$' "$f" | tail -n 60 | awk '{gsub(/%/, "%25"); gsub(/\r/, ""); printf "%s%%0A", $0}')"
          done

  # The GitHub Pages site (tools/pages/build.sh): the web app with the guest kernel
  # and the GPL sources. It is built and tested (Chrome, under /Vetro/ without
  # COOP/COEP, as Pages serves it) when something that ends up in the
  # site changes; it is published only from main and only if no job failed.
  # The guest kernel is the one cached by the boot job (same key).
  pages:
    needs: [changes, native, wasm, linux, boot]
    if: always() && !failure() && !cancelled() && needs.changes.outputs.site == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache/restore@v4
        with:
          path: target/guest-kernel
          key: guest-kernel-${{ hashFiles('guest/kernel/config/**', 'guest/kernel/initramfs/**', 'guest/kernel/kselftest/**', 'tools/guest-kernel/**', 'tools/guest-bins/**') }}
          fail-on-cache-miss: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Site
        run: |
          set -o pipefail
          tools/pages/build.sh 2>&1 | tee pages-build.log
      - name: Site in the browser
        run: |
          set -o pipefail
          node tests/web/pages.mjs 2>&1 | tee pages-test.log
        env:
          VETRO_REQUIRE_BROWSER: "1"
      - if: failure()
        run: |
          for f in pages-build.log pages-test.log; do
            [ -s "$f" ] || continue
            echo "::error title=$f::$(grep -vE '^\s*$' "$f" | tail -n 60 | awk '{gsub(/%/, "%25"); gsub(/\r/, ""); printf "%s%%0A", $0}')"
          done
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/pages

  deploy:
    if: always() && needs.pages.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: pages
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deploy
        uses: actions/deploy-pages@v4
