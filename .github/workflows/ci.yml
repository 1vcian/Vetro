name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # In CI uno skip dell'oracolo è un fallimento.
  VETRO_REQUIRE_ORACLE: "1"

jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (da rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Oracolo QEMU
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-user
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (da rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --target wasm32-unknown-unknown --workspace --exclude vetro-cli --exclude vetro-diff --exclude vetro-isa-tests --exclude vetro-linux-tests --exclude vetro-jit-native

  # Binari Linux arm64 (BusyBox, programmi C) confrontati con QEMU. Gira su
  # un runner arm64: il container Alpine che compila i binari è nativo.
  linux:
    runs-on: ubuntu-24.04-arm
    env:
      VETRO_REQUIRE_GUEST_BINS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (da rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Oracolo QEMU
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-user
      - uses: Swatinem/rust-cache@v2
      - name: Binari guest
        run: tools/guest-bins/build.sh
      - name: RISU (immagini e tracce di QEMU)
        run: tools/risu/build.sh
      - name: LTP (build)
        run: tools/ltp/build.sh
      - run: cargo test --release -p vetro-linux-tests
        env:
          VETRO_LTP_FULL: "1"
      # M4: gli stessi test col JIT (soglia 0: ogni blocco si traduce subito).
      - name: Test Linux col JIT
        run: cargo test --release -p vetro-linux-tests
        env:
          VETRO_LTP_FULL: "1"
          VETRO_JIT: "1"
          VETRO_JIT_THRESHOLD: "0"

  # Il lint TypeScript (tsc --noEmit) si aggiunge quando nasce web/ (M5).

  # M3: il kernel guest (Linux + initramfs) si avvia fino alla shell sotto
  # qemu-system-aarch64 (riferimento) e sotto Vetro, con lo stesso log.
  # Il kernel si ricompila solo se cambiano configurazione o script.
  boot:
    runs-on: ubuntu-24.04-arm
    env:
      VETRO_REQUIRE_GUEST_KERNEL: "1"
      VETRO_REQUIRE_SYSTEM_ORACLE: "1"
      # kselftest nel guest sotto QEMU e sotto Vetro (tests/boot/tests/kselftest.rs).
      VETRO_KSELFTEST: "1"
      # pcapng e HAR riletti da tshark, har-validator e haralyzer in Docker
      # (tests/boot/tests/analysis.rs, tools/analysis/check.sh, ADR 0016).
      VETRO_REQUIRE_ANALYSIS_TOOLS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (da rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Oracolo QEMU (sistema)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-arm
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: target/guest-kernel
          key: guest-kernel-${{ hashFiles('guest/kernel/config/**', 'guest/kernel/initramfs/**', 'guest/kernel/kselftest/**', 'tools/guest-kernel/**', 'tools/guest-bins/**') }}
      # kselftest.sh usa i sorgenti estratti da build.sh nel volume Docker:
      # si costruiscono insieme, e insieme vanno in cache.
      - name: Kernel guest, initramfs e kselftest
        run: |
          set -o pipefail
          test -f target/guest-kernel/initramfs-kselftest.cpio.gz \
            || { tools/guest-kernel/build.sh && tools/guest-kernel/kselftest.sh; } 2>&1 | tee boot-build.log
      # I log dei job si leggono solo da autenticati: in caso di errore le
      # ultime righe diventano annotazioni, visibili dall'API pubblica.
      - name: Avvio sotto QEMU e sotto Vetro
        run: |
          set -o pipefail
          cargo test --release -p vetro-boot-tests -- --nocapture --test-threads=1 2>&1 | tee boot-test.log
      # M4 (ADR 0013): lo stesso avvio col JIT della modalità sistema
      # (wasmtime) deve dare le stesse istruzioni e lo stesso log, byte per
      # byte, dell'interprete (il test esegue entrambi e li confronta).
      - name: Avvio sotto Vetro col JIT
        run: |
          set -o pipefail
          cargo test --release -p vetro-boot-tests --test vetro -- --nocapture 2>&1 | tee boot-jit.log
          grep -E '^(interprete|JIT \(soglia)' boot-jit.log | sed 's/^/::notice title=JIT nativo::/'
        env:
          VETRO_JIT: "1"
      # M4: la stessa macchina compilata a wasm32, in Node (V8), con
      # l'interprete e col JIT. Stesse istruzioni e stesso log
      # dell'interprete nativo; il passo fallisce se il JIT in V8 è più lento
      # dell'interprete nativo misurato qui (soglia di M4, ADR 0012).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Avvio in WebAssembly (Node), col JIT, e tempi
        run: |
          set -o pipefail
          tools/wasm-boot.sh --jit 2>&1 | tee wasm-boot.log
          grep -A4 '^==> tempi' wasm-boot.log | sed 's/^/::notice title=tempi di avvio::/'
      # M5: l'app web e l'API dei dispositivi di vetro-wasm in Node: disco
      # via HTTP Range (stesse istruzioni e stesso log di un disco locale),
      # framebuffer e ingressi; l'app in Chrome headless se il runner ce l'ha.
      - name: App web (Node, Chrome headless se c'è)
        run: |
          set -o pipefail
          tools/web-test.sh 2>&1 | tee web-test.log
      - if: failure()
        run: |
          for f in boot-build.log boot-test.log boot-jit.log wasm-boot.log web-test.log; do
            [ -s "$f" ] || continue
            echo "::error title=$f::$(grep -vE '^\s*$' "$f" | tail -n 60 | awk '{gsub(/%/, "%25"); gsub(/\r/, ""); printf "%s%%0A", $0}')"
          done

  # Il sito di GitHub Pages (tools/pages/build.sh): l'app web col kernel guest
  # e i sorgenti GPL. Si costruisce e si prova (Chrome, sotto /Vetro/ senza
  # COOP/COEP, come lo serve Pages) a ogni push; si pubblica solo da main e
  # solo se tutti gli altri job sono verdi. Il kernel guest è quello messo in
  # cache dal job boot (stessa chiave).
  pages:
    needs: [native, wasm, linux, boot]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (da rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache/restore@v4
        with:
          path: target/guest-kernel
          key: guest-kernel-${{ hashFiles('guest/kernel/config/**', 'guest/kernel/initramfs/**', 'guest/kernel/kselftest/**', 'tools/guest-kernel/**', 'tools/guest-bins/**') }}
          fail-on-cache-miss: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sito
        run: |
          set -o pipefail
          tools/pages/build.sh 2>&1 | tee pages-build.log
      - name: Sito nel browser
        run: |
          set -o pipefail
          node tests/web/pages.mjs 2>&1 | tee pages-test.log
        env:
          VETRO_REQUIRE_BROWSER: "1"
      - if: failure()
        run: |
          for f in pages-build.log pages-test.log; do
            [ -s "$f" ] || continue
            echo "::error title=$f::$(grep -vE '^\s*$' "$f" | tail -n 60 | awk '{gsub(/%/, "%25"); gsub(/\r/, ""); printf "%s%%0A", $0}')"
          done
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/pages

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: pages
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deploy
        uses: actions/deploy-pages@v4
