name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # In CI uno skip dell'oracolo è un fallimento.
  VETRO_REQUIRE_ORACLE: "1"

jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (da rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Oracolo QEMU
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-user
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (da rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --target wasm32-unknown-unknown --workspace --exclude vetro-cli --exclude vetro-diff --exclude vetro-isa-tests --exclude vetro-linux-tests

  # Binari Linux arm64 (BusyBox, programmi C) confrontati con QEMU. Gira su
  # un runner arm64: il container Alpine che compila i binari è nativo.
  linux:
    runs-on: ubuntu-24.04-arm
    env:
      VETRO_REQUIRE_GUEST_BINS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (da rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Oracolo QEMU
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-user
      - uses: Swatinem/rust-cache@v2
      - name: Binari guest
        run: tools/guest-bins/build.sh
      - name: RISU (immagini e tracce di QEMU)
        run: tools/risu/build.sh
      - name: LTP (build)
        run: tools/ltp/build.sh
      - run: cargo test --release -p vetro-linux-tests
        env:
          VETRO_LTP_FULL: "1"

  # Il lint TypeScript (tsc --noEmit) si aggiunge quando nasce web/ (M5).

  # M3: il kernel guest (Linux + initramfs) si avvia fino alla shell sotto
  # qemu-system-aarch64 (riferimento) e sotto Vetro, con lo stesso log.
  # Il kernel si ricompila solo se cambiano configurazione o script.
  boot:
    runs-on: ubuntu-24.04-arm
    env:
      VETRO_REQUIRE_GUEST_KERNEL: "1"
      VETRO_REQUIRE_SYSTEM_ORACLE: "1"
      # kselftest nel guest sotto QEMU e sotto Vetro (tests/boot/tests/kselftest.rs).
      VETRO_KSELFTEST: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (da rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Oracolo QEMU (sistema)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-arm
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: target/guest-kernel
          key: guest-kernel-${{ hashFiles('guest/kernel/config/**', 'guest/kernel/initramfs/**', 'guest/kernel/kselftest/**', 'tools/guest-kernel/**', 'tools/guest-bins/**') }}
      # kselftest.sh usa i sorgenti estratti da build.sh nel volume Docker:
      # si costruiscono insieme, e insieme vanno in cache.
      - name: Kernel guest, initramfs e kselftest
        run: |
          set -o pipefail
          test -f target/guest-kernel/initramfs-kselftest.cpio.gz \
            || { tools/guest-kernel/build.sh && tools/guest-kernel/kselftest.sh; } 2>&1 | tee boot-build.log
      # I log dei job si leggono solo da autenticati: in caso di errore le
      # ultime righe diventano annotazioni, visibili dall'API pubblica.
      - name: Avvio sotto QEMU e sotto Vetro
        run: |
          set -o pipefail
          cargo test --release -p vetro-boot-tests -- --nocapture --test-threads=1 2>&1 | tee boot-test.log
      - if: failure()
        run: |
          for f in boot-build.log boot-test.log; do
            [ -s "$f" ] || continue
            echo "::error title=$f::$(grep -vE '^\s*$' "$f" | tail -n 60 | awk '{gsub(/%/, "%25"); gsub(/\r/, ""); printf "%s%%0A", $0}')"
          done
