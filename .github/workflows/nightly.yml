name: nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  VETRO_REQUIRE_ORACLE: "1"

jobs:
  differential:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-user
      - uses: Swatinem/rust-cache@v2
      # Programmi casuali con semi nuovi a ogni notte (ADR 0006); un caso
      # fallito si riproduce con VETRO_DIFF_SEED=<seme> VETRO_DIFF_CASES=1.
      # Da M3: avvio del kernel headless.
      - run: cargo test --release -p vetro-diff -p vetro-isa-tests
        env:
          VETRO_DIFF_CASES: "20000"
          VETRO_DIFF_SEED: "${{ github.run_number }}000000"
