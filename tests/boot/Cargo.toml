[package]
name = "vetro-boot-tests"
description = "Boot of the M3 guest kernel (Image + initramfs) under qemu-system-aarch64, and from M3 under Vetro."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dev-dependencies]
vetro-machine = { path = "../../crates/vetro-machine" }
vetro-platform = { path = "../../crates/vetro-platform" }
# Network analysis of the guest traffic (tests/analysis.rs, M7).
vetro-analysis = { path = "../../crates/vetro-analysis" }
# The vetro-wasm API compiled for the host: reference for the web tests (tests/web).
vetro-wasm = { path = "../../crates/vetro-wasm" }
# The system-mode JIT on wasmtime (VETRO_JIT=1, ADR 0013).
vetro-jit-native = { path = "../../crates/vetro-jit-native" }

[lints]
workspace = true
