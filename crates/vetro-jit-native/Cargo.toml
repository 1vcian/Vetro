[package]
name = "vetro-jit-native"
description = "JIT engine on wasmtime, for the native tests and `vetro run --jit` (ADR 0012)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
vetro-jit = { path = "../vetro-jit" }
# The JIT's only external dependency, and only here (never in the core nor in the
# browser, which uses JavaScript's WebAssembly).
wasmtime = { version = "49", default-features = false, features = ["cranelift", "runtime", "std"] }

[dev-dependencies]
vetro-cpu = { path = "../vetro-cpu" }
vetro-mmu = { path = "../vetro-mmu" }
