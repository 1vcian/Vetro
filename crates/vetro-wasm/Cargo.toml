[package]
name = "vetro-wasm"
description = "Browser binding: the vetro-machine machine behind a C API for WebAssembly (docs/specs/wasm.md)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# cdylib: the .wasm module loaded by JS; rlib: the native tests of the API.
crate-type = ["cdylib", "rlib"]

[dependencies]
vetro-analysis = { path = "../vetro-analysis" }
vetro-machine = { path = "../vetro-machine" }
vetro-jit = { path = "../vetro-jit" }
vetro-platform = { path = "../vetro-platform" }

[lints]
workspace = true
