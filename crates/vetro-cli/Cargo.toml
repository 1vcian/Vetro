[package]
name = "vetro-cli"
description = "Runner nativo headless per test e CI."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "vetro"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
vetro-cpu = { path = "../vetro-cpu" }
vetro-analysis = { path = "../vetro-analysis" }
vetro-machine = { path = "../vetro-machine" }
# Solo per il runner nativo: syscall dell'host che std non espone
# (utimensat, mknodat...). Il core resta senza dipendenze.
libc = "0.2"

[dev-dependencies]
vetro-diff = { path = "../../tests/diff" }
