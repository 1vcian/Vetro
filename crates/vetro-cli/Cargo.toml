[package]
name = "vetro-cli"
description = "Headless native runner for tests and CI."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "vetro"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
vetro-cpu = { path = "../vetro-cpu" }
vetro-analysis = { path = "../vetro-analysis" }
vetro-machine = { path = "../vetro-machine" }
vetro-platform = { path = "../vetro-platform" }
vetro-jit = { path = "../vetro-jit" }
# JIT engine for `vetro run --jit` (wasmtime): the native runner does not go
# into the browser.
vetro-jit-native = { path = "../vetro-jit-native" }
# Only for the native runner: host syscalls that std does not expose
# (utimensat, mknodat...). The core stays dependency-free.
libc = "0.2"

[dev-dependencies]
vetro-diff = { path = "../../tests/diff" }
vetro-boot-tests = { path = "../../tests/boot" }
