[package]
name = "vetro-net"
description = "Virtual TCP/IP stack, sinkhole and relay client."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# Tests only: independent parser to validate the packets we produce
# (checksums, fields, DHCP, DNS). Not part of the crate nor of the WASM build. ADR 0007.
[dev-dependencies]
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ethernet", "proto-ipv4", "proto-dhcpv4", "proto-dns", "socket-raw"] }

[dependencies]
vetro-snapshot = { path = "../vetro-snapshot" }
