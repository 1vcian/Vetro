[package]
name = "vetro-net"
description = "Stack TCP/IP virtuale, sinkhole e client del relay."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# Solo per i test: parser indipendente per validare i pacchetti prodotti
# (checksum, campi, DHCP, DNS). Non entra nel crate né nel build WASM. ADR 0007.
[dev-dependencies]
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ethernet", "proto-ipv4", "proto-dhcpv4", "proto-dns", "socket-raw"] }

[dependencies]
vetro-snapshot = { path = "../vetro-snapshot" }
