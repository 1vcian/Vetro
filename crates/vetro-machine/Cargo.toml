[package]
name = "vetro-machine"
description = "The complete virt machine: CPU in system mode, MMU, platform and RAM, with deterministic time."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
vetro-cpu = { path = "../vetro-cpu" }
vetro-mmu = { path = "../vetro-mmu" }
vetro-platform = { path = "../vetro-platform" }
vetro-jit = { path = "../vetro-jit" }
vetro-net = { path = "../vetro-net" }
vetro-snapshot = { path = "../vetro-snapshot" }
# Accelerated guest graphics (ADR 0037): the gfxstream host decoder.
vetro-gfxstream = { path = "../vetro-gfxstream" }
# Introspection (ADR 0027): no dependencies, also builds for wasm.
vetro-analysis = { path = "../vetro-analysis" }

[dev-dependencies]
# The JIT on wasmtime for the parallel cores' litmus tests (ADR 0042).
vetro-jit-native = { path = "../vetro-jit-native" }

[lints]
workspace = true
