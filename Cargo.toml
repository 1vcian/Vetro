[workspace]
resolver = "3"
members = ["crates/*", "tests/boot", "tests/diff", "tests/isa", "tests/linux"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Le dipendenze esterne (in pratica wasmtime e cranelift, il motore del JIT
# nei test) ottimizzate anche nei build di debug: con cranelift non
# ottimizzato ogni blocco tradotto costa millisecondi e i test col JIT di
# `cargo test --workspace` diventano lenti. Il nostro codice resta in debug.
[profile.dev.package."*"]
opt-level = 2
