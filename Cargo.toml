[workspace]
resolver = "3"
members = ["crates/*", "tests/diff", "tests/isa", "tests/linux"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
