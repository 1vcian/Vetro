[workspace]
resolver = "3"
members = ["crates/*", "tests/boot", "tests/diff", "tests/isa", "tests/linux"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# External dependencies (in practice wasmtime and cranelift, the JIT engine
# in the tests) optimised even in debug builds: with unoptimised cranelift
# every translated block costs milliseconds and the JIT tests of
# `cargo test --workspace` become slow. Our own code stays in debug.
[profile.dev.package."*"]
opt-level = 2
